<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Ivea Coach</title>
<meta name="description" content="CRM personnel : candidatures, réseau et prospection" />

<!-- iOS PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4F46E5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ivea Coach" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- Header -->
  <header class="app-header">
    <h1 id="header-title">Tableau de bord</h1>
    <button id="header-action" class="icon-btn" hidden aria-label="Ajouter">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- Views -->
  <main id="view-root" class="view-root"></main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn" data-view="dashboard" aria-label="Tableau de bord">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 13h6V3H3v10zm0 8h6v-6H3v6zm8 0h10V11H11v10zm0-18v6h10V3H11z" fill="currentColor"/></svg>
      <span>Accueil</span>
      <em class="tab-badge" data-badge="dashboard" hidden></em>
    </button>
    <button class="tab-btn" data-view="pipeline" aria-label="Pipeline">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 4h18l-7 9v6l-4 2v-8L3 4z" fill="currentColor"/></svg>
      <span>Pipeline</span>
      <em class="tab-badge" data-badge="pipeline" hidden></em>
    </button>
    <button class="tab-btn" data-view="contacts" aria-label="Contacts">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z" fill="currentColor"/></svg>
      <span>Contacts</span>
      <em class="tab-badge" data-badge="contacts" hidden></em>
    </button>
    <button class="tab-btn" data-view="followups" aria-label="Relances">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6l4.2 2.5-.8 1.3-5-3V6h1.6v6.6z" fill="currentColor"/></svg>
      <span>Relances</span>
      <em class="tab-badge" data-badge="followups" hidden></em>
    </button>
    <button class="tab-btn" data-view="settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-1.7-1L15 3h-4l-.3 2.4a7.6 7.6 0 00-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 001.7 1L11 21h4l.3-2.4a7.6 7.6 0 001.7-1l2.4 1 2-3.4-2-1.6zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" fill="currentColor"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Floating action button -->
  <button id="fab" class="fab" hidden aria-label="Ajouter">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <!-- Modal sheet -->
  <div id="sheet-overlay" class="sheet-overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <button id="sheet-close" class="sheet-close" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div id="sheet-content" class="sheet-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
